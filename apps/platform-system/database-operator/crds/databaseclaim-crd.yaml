apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: databaseclaims.platform.example.com
spec:
  group: platform.example.com
  names:
    kind: DatabaseClaim
    listKind: DatabaseClaimList
    plural: databaseclaims
    singular: databaseclaim
    shortNames:
      - dbc
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      # Enable status subresource
      subresources:
        status: {}
      # Custom columns for 'kubectl get databaseclaims'
      additionalPrinterColumns:
        - name: DB-Name
          type: string
          jsonPath: .spec.dbName
          description: Requested database name
        - name: Status
          type: string
          jsonPath: .status.phase
          description: Current operational phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      # OpenAPI v3 Schema Validation
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - dbName
              properties:
                dbName:
                  type: string
                  pattern: '^[a-zA-Z0-9_-]+$'
                  minLength: 3
                  maxLength: 63
                  description: "Name of the database to provision (alphanumeric, underscores, hyphens only)."
                engine:
                  type: string
                  enum:
                    - postgresql
                    - mysql
                  default: postgresql
                  description: "Target database engine."
                storageGb:
                  type: integer
                  minimum: 1
                  maximum: 500
                  default: 5
                  description: "Allocated storage size in Gigabytes."
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Ready
                    - Failed
                  description: "High-level state of the DatabaseClaim."
                secretName:
                  type: string
                  description: "Name of the Kubernetes Secret containing generated credentials."
                message:
                  type: string
                  description: "Informational message detailing current state."
