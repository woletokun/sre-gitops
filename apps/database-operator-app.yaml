apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: database-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/woletokun/sre-gitops.git'
    targetRevision: HEAD
    path: apps/platform-system/database-operator/templates
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: platform-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: postgres-backend
      jsonPointers:
        - /spec/volumeClaimTemplates
