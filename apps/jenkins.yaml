apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://charts.jenkins.io'
    chart: jenkins
    targetRevision: 5.8.15
    helm:
      values: |
        controller:
          jenkinsUriPrefix: "/jenkins"
          jenkinsOpts: "--prefix=/jenkins"
          jenkinsUrl: "http://172.18.20.115/jenkins/"
          admin:
            username: "admin"
            password: "AdminPassword123!"
          healthProbes: true
          serviceType: "ClusterIP"
          image:
            tag: "lts-jdk17"
          installPlugins:
            - "configuration-as-code"
            - "kubernetes"
          ingress:
            enabled: true
            ingressClassName: nginx
            path: /jenkins
          resources:
            requests:
              cpu: "500m"
              memory: "1024Mi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"
        persistence:
          enabled: true
          storageClass: "local-path"
          size: "10Gi"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: jenkins
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
