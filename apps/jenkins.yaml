apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://charts.jenkins.io'
    chart: jenkins
    targetRevision: 5.8.15
    helm:
      values: |
        controller:
          componentName: "jenkins-controller"
          jenkinsOpts: "--prefix=/jenkins"
          jenkinsUrl: "http://172.18.20.115/jenkins/"
          javaOpts: "-Xmx1536m"
          healthEndPoints:
            - "/jenkins/login"
          startupProbe:
            httpGet:
              path: "/jenkins/login"
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: "/jenkins/login"
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: "/jenkins/login"
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          serviceType: "ClusterIP"
          image:
            tag: "lts-jdk17"
          installPlugins:
            - "configuration-as-code"
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              nginx.ingress.kubernetes.io/ssl-redirect: "false"
            paths:
              - path: "/jenkins"
                pathType: Prefix
          resources:
            requests:
              cpu: "500m"
              memory: "1024Mi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"
        persistence:
          enabled: true
          storageClass: "local-path"
          size: "10Gi"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: jenkins
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
