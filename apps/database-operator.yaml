apiVersion: v1
kind: Namespace
metadata:
  name: platform-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: database-operator-code
  namespace: platform-system
data:
  operator.py: |
    import kopf
    import kubernetes

    @kopf.on.create('platform.example.com', 'v1alpha1', 'databaseclaims')
    def create_db(spec, name, namespace, logger, **kwargs):
        logger.info(f"Creating DB claim for {name}")
        kubernetes.config.load_incluster_config()
        api = kubernetes.client.CoreV1Api()
        
        db_name = spec.get('dbName', 'default')
        sec = {
            "apiVersion": "v1",
            "kind": "Secret",
            "metadata": {
                "name": f"{name}-creds",
                "namespace": namespace
            },
            "stringData": {
                "DB_NAME": db_name,
                "USER": f"user_{name}",
                "PASSWORD": "GeneratedPassword123!"
            }
        }
        
        kopf.adopt(sec)
        api.create_namespaced_secret(namespace=namespace, body=sec)
        logger.info(f"Secret {name}-creds created successfully")
        return {'status': 'Ready', 'secret': f"{name}-creds"}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: database-operator-sa
  namespace: platform-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: database-operator-role
rules:
  - apiGroups: ["platform.example.com"]
    resources: ["databaseclaims", "databaseclaims/status"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["secrets", "events"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: database-operator-binding
subjects:
  - kind: ServiceAccount
    name: database-operator-sa
    namespace: platform-system
roleRef:
  kind: ClusterRole
  name: database-operator-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database-operator
  namespace: platform-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database-operator
  template:
    metadata:
      labels:
        app: database-operator
    spec:
      serviceAccountName: database-operator-sa
      containers:
        - name: operator
          image: python:3.11-slim
          command: ["sh", "-c"]
          args:
            - |
              pip install --no-cache-dir kopf kubernetes && kopf run --all-namespaces /app/operator.py
          volumeMounts:
            - name: operator-code
              mountPath: /app
      volumes:
        - name: operator-code
          configMap:
            name: database-operator-code
