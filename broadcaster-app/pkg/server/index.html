<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BroadCaster Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 24px; width: 100%; max-width: 600px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); }
        h1 { color: #38bdf8; margin-bottom: 20px; font-size: 1.5rem; text-align: center; }
        .auth-box { display: flex; flex-direction: column; gap: 12px; }
        input { background: #0f172a; border: 1px solid #475569; color: #fff; padding: 10px 14px; border-radius: 6px; font-size: 0.95rem; }
        input:focus { outline: none; border-color: #38bdf8; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button { flex: 1; padding: 10px; border: none; border-radius: 6px; background: #0284c7; color: white; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0369a1; }
        button.secondary { background: #334155; }
        button.secondary:hover { background: #475569; }
        #chat-box { display: none; flex-direction: column; gap: 12px; }
        #messages { background: #0f172a; border: 1px solid #334155; height: 350px; border-radius: 6px; padding: 12px; overflow-y: auto; font-family: monospace; }
        .msg { margin-bottom: 6px; word-break: break-all; }
        .system { color: #f59e0b; }
        .user-msg { color: #38bdf8; }
        .input-row { display: flex; gap: 8px; }
        .input-row input { flex: 1; }
        #status-bar { font-size: 0.85rem; margin-top: 8px; color: #94a3b8; text-align: right; }
    </style>
</head>
<body>

<div class="card">
    <h1>📡 BroadCaster Hub</h1>

    <!-- Auth View -->
    <div id="auth-view" class="auth-box">
        <input type="text" id="username" placeholder="Username" required />
        <input type="email" id="email" placeholder="Email (Registration only)" />
        <input type="password" id="password" placeholder="Password" required />
        <div class="btn-group">
            <button onclick="login()">Login</button>
            <button class="secondary" onclick="register()">Register</button>
        </div>
        <div id="auth-error" style="color: #ef4444; font-size: 0.85rem; margin-top: 6px;"></div>
    </div>

    <!-- Chat View -->
    <div id="chat-box">
        <div id="messages"></div>
        <div class="input-row">
            <input type="text" id="msg-input" placeholder="Type a broadcast message..." onkeypress="handleKey(event)" />
            <button onclick="sendMessage()">Send</button>
        </div>
        <div id="status-bar">Status: <span id="status" style="color:#ef4444;">Disconnected</span></div>
    </div>
</div>

<script>
    let token = '';
    let currentUser = '';
    let ws = null;

    async function register() {
        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        try {
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, password })
            });
            if (res.ok) {
                alert('Registration successful! Please login.');
            } else {
                const text = await res.text();
                document.getElementById('auth-error').innerText = text;
            }
        } catch (e) {
            document.getElementById('auth-error').innerText = 'Server connection failed';
        }
    }

    async function login() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            if (res.ok) {
                const data = await res.json();
                token = data.token;
                currentUser = data.username;
                document.getElementById('auth-view').style.display = 'none';
                document.getElementById('chat-box').style.display = 'flex';
                connectWebSocket();
            } else {
                document.getElementById('auth-error').innerText = 'Invalid username or password';
            }
        } catch (e) {
            document.getElementById('auth-error').innerText = 'Login error';
        }
    }

    function connectWebSocket() {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws?username=${encodeURIComponent(currentUser)}`;
        
        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
            document.getElementById('status').innerText = 'Connected';
            document.getElementById('status').style.color = '#10b981';
        };

        ws.onmessage = (event) => {
            const msgs = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'msg ' + (event.data.startsWith('-->') ? 'system' : 'user-msg');
            div.innerText = event.data;
            msgs.appendChild(div);
            msgs.scrollTop = msgs.scrollHeight;
        };

        ws.onclose = () => {
            document.getElementById('status').innerText = 'Disconnected';
            document.getElementById('status').style.color = '#ef4444';
        };
    }

    function sendMessage() {
        const input = document.getElementById('msg-input');
        if (input.value && ws && ws.readyState === WebSocket.OPEN) {
            ws.send(input.value);
            input.value = '';
        }
    }

    function handleKey(e) {
        if (e.key === 'Enter') sendMessage();
    }
</script>
</body>
</html>
